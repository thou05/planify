name: Deploy Frontend to Vercel

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-vercel.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Override Git author on ephemeral CI runner to bypass Vercel Hobby collaboration check
      - name: Override Git Author to Vercel Owner
        run: |
          EMAIL="${{ secrets.VERCEL_USER_EMAIL }}"
          if [ -z "$EMAIL" ]; then
            EMAIL="thaao.lt@gmail.com"
          fi
          NAME="${{ secrets.VERCEL_USER_NAME }}"
          if [ -z "$NAME" ]; then
            NAME="thao-0c5d"
          fi
          git config user.email "$EMAIL"
          git config user.name "$NAME"
          git commit --amend --no-edit --reset-author

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link Vercel Project
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
